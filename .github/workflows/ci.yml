name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    name: C# build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # The library targets .NET 8 and .NET 10 (LTS); tests run on both
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build (warnings are errors)
        run: dotnet build Eppstein.sln -c Release
      - name: Test
        run: dotnet test Eppstein.sln -c Release --no-build
      - name: Package
        run: dotnet pack Eppstein/Eppstein.csproj -c Release --no-build -o artifacts

  go:
    name: Go ${{ matrix.go }} vet and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum version from go.mod, and the two supported Go releases
        go: ['1.23', oldstable, stable]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Formatting
        if: matrix.go == 'stable'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Not gofmt-formatted: $unformatted"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Test (with race detector)
        run: go test -race ./...

  benchmark:
    name: Benchmark comparison
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-dotnet@v4
        with:
          # base and head may target different .NET versions
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest
      - name: Compare base and head
        run: head/.github/scripts/compare-benchmarks.sh base head >> "$GITHUB_STEP_SUMMARY"
